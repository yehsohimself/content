<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content</title>
<link rel="icon" href="/static/logo/content.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Content (2026-10-29, sade sürüm): link → ne istediğiniz → adım adım rehber. Tek akış, tek birincil düğme, teknik dil yok. */
:root{
  --bg:#08080a; --yuzey:#111114; --yuzey2:#1a1a1f; --cizgi:rgba(255,255,255,.1); --cizgi2:rgba(255,255,255,.2);
  --ink:#f2f2f4; --ink2:#a8a8b0; --ink3:#73737c; --vurgu:#F2C230; --vurgu-ink:#141414; --vurgu-rgb:242,194,48;
  --yesil:#34c77b; --turuncu:#ff9f43; --kirmizi:#ff5d5d; --r:18px;
}
:root[data-theme="light"]{
  --bg:#f6f6f3; --yuzey:#ffffff; --yuzey2:#f0f0ec; --cizgi:rgba(0,0,0,.09); --cizgi2:rgba(0,0,0,.18);
  --ink:#1c1c1e; --ink2:#55555c; --ink3:#8a8a92; --vurgu:#E0AE12; --vurgu-rgb:224,174,18;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Geist,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background-image:radial-gradient(ellipse 70% 40% at 50% -10%,rgba(var(--vurgu-rgb),.13),transparent 70%);background-attachment:fixed}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.gri{color:var(--ink3)}
/* üst çubuk ve ürün değiştirici (diğer ürünlerle aynı) */
.nav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;padding:0 16px;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--cizgi)}
.markaGrup{grid-column:2;position:relative;display:flex;align-items:center;gap:2px}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);padding:6px 8px;border-radius:10px}
.brand img{width:24px;height:24px;border-radius:6px;display:block}
.brand .bt{font:600 15px/1 Geist,-apple-system,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.urunbtn{width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:var(--ink2);display:grid;place-items:center}
.urunbtn:hover{background:var(--yuzey2);color:var(--ink)}
.urunbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.urunMenu{display:none;position:absolute;top:44px;left:50%;transform:translateX(-50%);background:var(--yuzey);border:1px solid var(--cizgi2);border-radius:16px;box-shadow:0 24px 60px -12px rgba(0,0,0,.55);padding:8px;z-index:40;min-width:200px}
.urunMenu.acik{display:block}
.urunMenu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);font-weight:500;text-decoration:none}
.urunMenu a:hover,.urunMenu a.on{background:var(--yuzey2)}
.urunMenu img{width:22px;height:22px;border-radius:6px}
.navsag{grid-column:3;justify-self:end}
.navsag{display:flex;gap:6px}
.tema{border:1px solid var(--cizgi);background:none;border-radius:99px;min-width:34px;height:34px;padding:0 8px;color:var(--ink2);font-size:12.5px;font-weight:600}
.ayarsatir{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--cizgi)}
.ayarsatir:first-of-type{border-top:0}
.ayarsatir div{flex:1}
.ayarsatir b{display:block;font-size:15px}
.ayarsatir small{display:block;color:var(--ink3);font-size:13.5px;margin-top:2px}
.ayarsatir input[type=checkbox]{width:22px;height:22px;accent-color:var(--vurgu);margin-top:2px}
.ayarsatir select{background:var(--yuzey2);color:var(--ink);border:1px solid var(--cizgi);border-radius:10px;padding:6px 8px;font:inherit}
main{max-width:760px;margin:0 auto;padding:0 16px 120px}
/* düğmeler */
.btn{text-decoration:none;display:inline-block;border:1px solid var(--cizgi);border-radius:99px;padding:12px 20px;font-weight:600;font-size:15px;background:var(--yuzey2);color:var(--ink)}
.btn:hover{border-color:var(--cizgi2)}
.btn.ana{background:var(--vurgu);color:var(--vurgu-ink);border-color:transparent;box-shadow:0 10px 30px -10px rgba(var(--vurgu-rgb),.6)}
.btn.ana:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.btn.buyuk{width:100%;padding:17px 20px;font-size:17px}
.btn.kucuk{padding:7px 14px;font-size:14px}
.metin{background:none;border:0;color:var(--vurgu);font-weight:600;padding:4px 2px;font-size:15px}
:root[data-theme="light"] .metin{color:#9a7400}
/* giriş */
.hero{text-align:center;padding:56px 0 24px}
.hero h1{font-size:clamp(40px,7vw,60px);line-height:1.02;letter-spacing:-.035em;margin:0 0 12px;font-weight:700}
.hero p{color:var(--ink2);max-width:460px;margin:0 auto;font-size:17px}
.kart{background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r);padding:20px}
.adimno{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-weight:600;font-size:17px}
.adimno i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--vurgu);color:var(--vurgu-ink);font-size:14px;font-weight:700}
.adimno small{font-weight:400;color:var(--ink3);font-size:14px}
.sonuc-adim.kapali{opacity:.4;pointer-events:none}
.sonuc-adim + .sonuc-adim{margin-top:22px;padding-top:22px;border-top:1px solid var(--cizgi)}
.linkkutu{display:flex;gap:8px;align-items:center;background:var(--yuzey2);border:1px solid var(--cizgi);border-radius:14px;padding:6px 6px 6px 14px}
.linkkutu:focus-within{border-color:var(--vurgu)}
.linkkutu input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:10px 0;outline:none}
.ipucu{font-size:14px;color:var(--ink3);margin:8px 2px 0}
.ipucu.hata{color:var(--kirmizi)}
.ipucu.ok{color:var(--yesil)}
.soru{font-size:14px;color:var(--ink2);margin:14px 0 8px}
.secimler{display:flex;flex-wrap:wrap;gap:8px}
.secim{border:1px solid var(--cizgi2);background:none;border-radius:99px;padding:10px 16px;font-size:15px;color:var(--ink)}
.secim[aria-pressed=true]{background:var(--vurgu);border-color:transparent;color:var(--vurgu-ink);font-weight:600}
.secim[aria-pressed=true]::before{content:'✓ '}
textarea.serbest{width:100%;margin-top:14px;border:1px solid var(--cizgi);background:var(--yuzey2);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;min-height:76px;resize:vertical;outline:none}
textarea.serbest:focus{border-color:var(--vurgu)}
.gonder{margin-top:18px}
.gonder .ipucu{text-align:center}
/* geçmiş */
.bas2{display:flex;align-items:baseline;justify-content:space-between;margin:44px 0 12px}
.bas2 h2{margin:0;font-size:20px;letter-spacing:-.01em}
.gecmis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gkart{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:14px;padding:10px}
.gkart:hover{border-color:var(--cizgi2)}
.gkart .k{width:54px;height:72px;flex:none;border-radius:9px;background:var(--yuzey2) center/cover}
.gkart b{display:block;font-size:14.5px;line-height:1.3}
.gkart small{display:block;color:var(--ink3);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nokta{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--vurgu);margin-right:5px;vertical-align:1px;animation:nabiz 1.4s infinite}
.nokta.hata{background:var(--kirmizi);animation:none}
@keyframes nabiz{50%{opacity:.3}}
/* iş sayfası */
.geri{display:inline-block;margin:20px 0 4px;color:var(--ink2);text-decoration:none;font-size:15px}
.ust{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;margin-top:12px}
.video{width:200px;aspect-ratio:9/16;border-radius:16px;background:var(--yuzey2) center/cover;border:1px solid var(--cizgi);overflow:hidden}
.video.yatay{width:320px;aspect-ratio:16/9}
.video video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.etk{font-size:14px;color:var(--ink3);margin:0 0 4px}
h1.sonuc{font-size:clamp(28px,4.6vw,38px);line-height:1.1;letter-spacing:-.02em;margin:0 0 10px}
.guven{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--yuzey2);border:1px solid var(--cizgi);margin-bottom:12px}
.guven i{width:8px;height:8px;border-radius:50%;background:var(--yesil)}
.guven.orta i{background:var(--vurgu)} .guven.dusuk i{background:var(--turuncu)}
.ozet{font-size:16.5px;color:var(--ink);margin:0}
.istekiniz{font-size:14px;color:var(--ink3);margin:12px 0 0}
.bolum{margin-top:36px}
.bolum > h2{font-size:21px;letter-spacing:-.01em;margin:0 0 4px}
.bolum > p.alt{color:var(--ink3);margin:0 0 14px;font-size:15px}
.gerek{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.gerek .kart{padding:14px 16px}
.gerek b{display:block;font-size:16px}
.gerek p{margin:4px 0 0;font-size:14.5px;color:var(--ink2)}
.etiket{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--yuzey2);color:var(--ink2);margin-top:8px;margin-right:4px}
.etiket.ucret{color:var(--turuncu)} .etiket.bedava{color:var(--yesil)}
.katmanlar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.katman{font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--cizgi2);color:var(--ink2)}
.katman.degisti{border-color:var(--vurgu);color:var(--ink)}
.gerek .kart.vurgulu{border-color:rgba(var(--vurgu-rgb),.6)}
.gerek .kart a.btn{display:inline-block;margin-top:10px;text-decoration:none}
.ilerleme{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.ilerleme .cubuk{flex:1;height:8px;border-radius:99px;background:var(--yuzey2);overflow:hidden}
.ilerleme .cubuk span{display:block;height:100%;background:var(--yesil);border-radius:99px;transition:width .3s}
.ilerleme b{font-size:14px;color:var(--ink2);font-weight:600;white-space:nowrap}
.adimlar{display:flex;flex-direction:column;gap:10px}
.adim{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r);padding:16px}
.adim.simdi{border-color:var(--vurgu);box-shadow:0 0 0 3px rgba(var(--vurgu-rgb),.15)}
.adim.bitti{opacity:.6;padding:12px 16px;align-items:center}
.adim.bitti .ne,.adim.bitti .ip,.adim.bitti .yer,.adim.bitti .emin{display:none}
.adim.bitti h3{margin:0;text-decoration:line-through;text-decoration-color:var(--ink3)}
.adim .tik{width:44px;height:44px;border-radius:50%;border:2px solid var(--cizgi2);background:none;display:grid;place-items:center;font-weight:700;font-size:16px;color:var(--ink2)}
.adim.simdi .tik{border-color:var(--vurgu);color:var(--vurgu)}
.adim.bitti .tik{background:var(--yesil);border-color:var(--yesil);color:#fff}
.adim h3{margin:2px 0 2px;font-size:17px;line-height:1.3}
.adim .yer{font-size:13.5px;color:var(--ink3)}
.adim .ne{margin:6px 0 0;font-size:16px}
.adim .ip{margin:8px 0 0;font-size:14.5px;color:var(--ink2);background:var(--yuzey2);border-radius:10px;padding:8px 11px}
.adim .emin{margin:8px 0 0;font-size:14px;color:var(--turuncu)}
.adim .simdirozet{display:inline-block;font-size:12px;font-weight:700;color:var(--vurgu-ink);background:var(--vurgu);border-radius:99px;padding:1px 8px;margin-bottom:4px}
ul.duz{margin:0;padding-left:20px} ul.duz li{margin:6px 0}
.farkli .secimler{margin-top:2px}
.farkli .satir{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.farkli input{flex:1 1 220px;min-width:0;border:1px solid var(--cizgi);background:var(--yuzey2);color:var(--ink);border-radius:99px;padding:11px 16px;font:inherit;font-size:15.5px;outline:none}
.farkli input:focus{border-color:var(--vurgu)}
details.ayrinti{margin-top:36px;border-top:1px solid var(--cizgi);padding-top:16px}
details.ayrinti summary{cursor:pointer;font-weight:600;color:var(--ink2);list-style:none}
details.ayrinti summary::-webkit-details-marker{display:none}
details.ayrinti summary::after{content:' ›';display:inline-block;transition:transform .2s}
details.ayrinti[open] summary::after{transform:rotate(90deg)}
details.ayrinti h4{margin:18px 0 6px;font-size:15px}
details.ayrinti ul{margin:0;padding-left:20px;color:var(--ink2);font-size:14.5px}
details.ayrinti li{margin:4px 0}
.altlar{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px;align-items:center}
.altlar .sag{margin-left:auto}
/* bekleme */
.bekleme h1{font-size:clamp(26px,4.4vw,34px);letter-spacing:-.02em;margin:0 0 6px}
.asamalar{list-style:none;margin:18px 0 0;padding:0}
.asamalar li{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:16px;color:var(--ink3)}
.asamalar li i{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--cizgi2);display:grid;place-items:center;font-style:normal;font-size:13px}
.asamalar li.bitti{color:var(--ink2)} .asamalar li.bitti i{background:var(--yesil);border-color:var(--yesil);color:#fff}
.asamalar li.simdi{color:var(--ink);font-weight:600} .asamalar li.simdi i{border-color:var(--vurgu);border-top-color:transparent;animation:don 1s linear infinite}
@keyframes don{to{transform:rotate(360deg)}}
.hatakart{border-color:rgba(255,93,93,.5)}
.kart.dogru{margin-top:20px;padding:16px 18px}
.kart.dogru p{margin:0;font-size:15px;color:var(--ink2)}
.kart.dogru p b{color:var(--ink)}
.kart.dogru .dsoru{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-size:15px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast button{background:none;border:0;color:var(--vurgu);font-weight:700;padding:0}
:root[data-theme="light"] .toast button{color:#9a7400}
.perde{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:grid;place-items:center;padding:16px}
.pencere{background:var(--yuzey);border:1px solid var(--cizgi2);border-radius:20px;padding:22px;max-width:520px;width:100%}
.pencere h4{margin:0 0 8px;font-size:19px}
.pencere p{margin:0 0 12px;color:var(--ink2)}
.pencere code{display:block;white-space:pre-wrap;background:var(--yuzey2);border-radius:12px;padding:12px;font-size:14px;margin-bottom:14px}
.pencere .alt{display:flex;gap:10px;justify-content:flex-end}
/* hareketli anlatım (2026-10-31): yapılış şeması, ne değişti, adım yolu, benzer video ölçüsü, inceleme taraması. Nokta ızgarası, ince çizgi, akan tek ışık. */
.gz{position:relative;background:var(--yuzey);border:1px solid var(--cizgi);border-radius:var(--r);padding:22px 18px 16px;overflow:hidden;
  background-image:radial-gradient(circle,var(--cizgi) 1px,transparent 1.4px);background-size:16px 16px;background-position:-4px -4px}
.gz::before{content:'';position:absolute;inset:-40% -10% auto;height:70%;background:radial-gradient(ellipse at 50% 0,rgba(var(--vurgu-rgb),.10),transparent 70%);pointer-events:none}
.sema{position:relative;display:flex;align-items:flex-start}
.sdugum{flex:0 0 auto;width:96px;text-align:center;position:relative;z-index:1}
.sdugum .ik{width:58px;height:58px;margin:0 auto;border-radius:16px;border:1px solid var(--cizgi2);background:var(--yuzey2) center/cover;display:grid;place-items:center;color:var(--ink2);transition:border-color .5s,box-shadow .5s,color .5s,transform .5s}
.sdugum .ik svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sdugum .ik.foto{border-radius:14px}
.sdugum .ik.foto svg{display:none}
.sdugum b{display:block;font-size:13.5px;line-height:1.25;margin-top:9px;color:var(--ink2);transition:color .5s}
.sdugum.on .ik{border-color:var(--vurgu);color:var(--vurgu);box-shadow:0 0 0 4px rgba(var(--vurgu-rgb),.14),0 0 26px rgba(var(--vurgu-rgb),.35);transform:translateY(-2px)}
.sdugum.on b{color:var(--ink)}
.sdugum b small{display:none;font-weight:400;font-size:13px;color:var(--ink3);margin-top:2px}
.sdugum.bitti .ik{border-color:rgba(var(--vurgu-rgb),.45);color:var(--ink)}
.sbag{flex:1 1 auto;min-width:18px;height:58px;position:relative}
.sbag::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--cizgi2)}
.sbag i{position:absolute;top:50%;left:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--vurgu);box-shadow:0 0 10px 2px rgba(var(--vurgu-rgb),.7);opacity:0}
.sbag.on::before,.sbag.gecti::before{border-top-style:solid;border-color:rgba(var(--vurgu-rgb),.55)}
.sbag.on i{animation:akis 1.5s cubic-bezier(.45,0,.3,1) forwards}
@keyframes akis{0%{left:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:100%;opacity:0}}
.santim{min-height:22px;margin:14px 0 0;text-align:center;font-size:14.5px;color:var(--ink2);transition:opacity .35s}
.santim.gizle{opacity:0}
/* ne değişti: orijinal → bu video; korunan katman düz geçer, değişen katman sarı düğümden geçer */
.degis .kareler{display:flex;justify-content:center;align-items:center;gap:14px;margin-bottom:16px}
.degis .kare{height:150px;aspect-ratio:16/9;flex:0 1 auto;min-width:0;border-radius:12px;border:1px solid var(--cizgi2);background:var(--yuzey2) center/cover;position:relative;overflow:hidden}
.degis .kare.dikey{aspect-ratio:9/16}
.degis .kare span{position:absolute;left:6px;bottom:6px;white-space:nowrap;font-size:11.5px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:2px 9px}
.degis .kare.bos{display:grid;place-items:center;border-style:dashed;color:var(--ink3);font-size:13px;text-align:center;padding:10px}
.degis .ok{flex:0 0 84px;text-align:center;font-size:12px;color:var(--ink3);line-height:1.3}
.degis .ok svg{display:block;margin:0 auto 4px;width:34px;height:34px;color:var(--vurgu);stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;animation:nefes 2.4s ease-in-out infinite}
@keyframes elmas{50%{transform:rotate(45deg) scale(1.25);box-shadow:0 0 18px rgba(var(--vurgu-rgb),.9)}}
@keyframes nefes{50%{transform:scale(1.12);filter:drop-shadow(0 0 8px rgba(var(--vurgu-rgb),.7))}}
.dsatir{display:grid;grid-template-columns:76px 1fr 150px;align-items:center;gap:12px;padding:7px 0}
.dsatir + .dsatir{border-top:1px solid var(--cizgi)}
.dsatir .ad{font-size:13.5px;color:var(--ink2);font-weight:600}
.dsatir .du{font-size:13.5px;color:var(--ink2)}
.dsatir.dg .du{color:var(--ink);font-weight:600}
.iz{position:relative;height:18px}
.iz::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1.5px solid var(--ink3);opacity:.6}
.iz i{position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ink2);animation:gec 3.2s linear infinite;animation-delay:var(--g,0s)}

.degis .dozet{margin:12px 0 0;font-size:14.5px;color:var(--ink2)}

.yol span{font-size:13px;padding:2px 9px;border-radius:8px;background:var(--yuzey2);border:1px solid var(--cizgi);color:var(--ink2)}
.yol em{font-style:normal;color:var(--ink3);font-size:12px}
.yol span:last-child{border-color:rgba(var(--vurgu-rgb),.5);color:var(--ink)}
.adim.simdi .yol span,.adim.simdi .yol em{opacity:0;animation:belir .45s ease forwards;animation-delay:calc(var(--s) * .38s)}
@keyframes belir{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.adim.simdi .yol span:last-child{position:relative}
.adim.simdi .yol span:last-child::after{content:'';position:absolute;right:-6px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:rgba(var(--vurgu-rgb),.9);animation:dokun 2.2s ease-out infinite;animation-delay:calc(var(--s) * .38s + .3s);opacity:0}

/* benzer videolar: ses ve görüntü ölçüsü */
.bzl{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.bz{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;text-decoration:none}
.bz .k{width:72px;aspect-ratio:16/9;border-radius:8px;background:var(--yuzey2) center/cover;border:1px solid var(--cizgi)}
.bz b{display:block;font-size:13.5px;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bz .olc{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:6px;font-size:12px;color:var(--ink3);margin-top:3px}
.bz .olc .c{height:5px;border-radius:99px;background:var(--yuzey2);overflow:hidden}
.bz .olc .c span{display:block;height:100%;border-radius:99px;background:var(--ink3);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bz .olc .c span.y{background:var(--vurgu)}
.bz small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
/* inceleme sırasında kapak taranır */
.video.tara{position:relative}

.video.tara::after{content:'';position:absolute;left:0;right:0;height:28%;top:-28%;background:linear-gradient(to bottom,transparent,rgba(var(--vurgu-rgb),.28) 85%,rgba(var(--vurgu-rgb),.95) 100%);animation:tarama 2.6s cubic-bezier(.45,0,.55,1) infinite}

const rehberMetni = y => [y.baslik || t(YONTEM_AD[y.yontem]) || '', y.ozet || '', '',
  (y.araclar || []).length ? t('Size gerekenler') + ': ' + y.araclar.map(a => { const [ad, o] = aracAdi(a); return o ? `${ad} (${DIL === 'en' ? 'for example' : 'örneğin'} ${o})` : ad; }).join(', ') : '',
  y.sablon && y.sablon.var ? t('Şablon') + ': ' + (y.sablon.nasil_bulunur || '') : '', '',
  ...(y.adimlar || []).map((a, i) => `${i + 1}. ${a.baslik}${a.nerede ? ' (' + a.nerede + ')' : ''}: ${a.ne_yapilir}${a.ipucu ? (DIL === 'en' ? ' Tip: ' : ' İpucu: ') + a.ipucu : ''}`)].join('\n').replace(/\n{3,}/g, '\n\n').trim();
const claudeIstegi = d => { const ad = String((d.kaynak || {}).baslik || d.istek || 'video').slice(0, 60), u = `${location.origin}/#c=${d.id}`;
  return DIL === 'en' ? `Carry out the Content guide "${ad}" on my computer (${u}). Do the steps in order while watching the screen; stop and ask me at any step that needs a login, a payment or my phone.`
    : `Content'teki "${ad}" rehberini bilgisayarımda uygula (${u}). Adımları sırayla ekranı görerek yap; giriş, ödeme ya da telefonda yapılması gereken adımda dur ve bana sor.`; };

$('#isSayfa').addEventListener('click', async e => {
  const el = e.target.closest('[data-adim],[data-g],[data-dogru],.secim'); if (!el || !D) return;
  if (el.dataset.dogru){
    if (el.dataset.dogru === 'dogru'){ try{ await api(`/api/content/${D.id}/dogru`, json({karar: 'dogru'})); dogruAcik = ''; imza = ''; isYukle(D.id); toast('Teşekkürler.'); }catch(er){ toast(er.message); } return; }
    dogruAcik = el.dataset.dogru; const y0 = window.scrollY; isCiz(); window.scrollTo(0, y0); $('#dogruNot') && $('#dogruNot').focus(); return;
  }
  if (el.matches('.secim')){ el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')); return; }
  if (el.dataset.adim !== undefined){
    const k = 'cAdim_' + D.id; let ok = {}; try{ ok = JSON.parse(store.get(k, '{}')); }catch(x){}
    if (ok[el.dataset.adim]) delete ok[el.dataset.adim]; else ok[el.dataset.adim] = 1; store.set(k, JSON.stringify(ok));
    const y0 = window.scrollY; isCiz(); window.scrollTo(0, y0); return;
  }
  const g = el.dataset.g;
  if (g === 'rehberKopyala') kopyala(rehberMetni(D.yontem), 'Rehber kopyalandı.');
  else if (g === 'kopyalaMetin') kopyala(el.dataset.m);
  else if (g === 'claude') kopyala(claudeIstegi(D), 'İstek kopyalandı. Claude uygulamasına yapıştırın.');
  else if (g === 'dogruGonder'){
    const not_ = ($('#dogruNot') || {}).value || ''; if (!not_.trim()){ toast('Videonun aslında nasıl yapıldığını kısaca yazın.'); return; }
    try{ await api(`/api/content/${D.id}/dogru`, json({karar: dogruAcik, not: not_.trim()})); dogruAcik = ''; store.set('cAdim_' + D.id, '{}'); imza = ''; window.scrollTo(0, 0); isYukle(D.id); }catch(er){ toast(er.message); }
  }
  else if (g === 'yeniden'){ try{ await api(`/api/content/${D.id}/yontem`, json({dil: DIL})); imza = ''; isYukle(D.id); }catch(er){ toast(er.message); } }
  else if (g === 'farkli'){
    const ek = [...$$('#farkliSec .secim[aria-pressed=true]').map(b => t(b.dataset.v)), $('#farkliMetin').value.trim()].filter(Boolean).join('. ');
    if (!ek){ toast('Önce bir seçenek seçin ya da ne istediğinizi yazın.'); return; }
    try{ await api(`/api/content/${D.id}/istek`, json({istek: [D.istek, ek].filter(Boolean).join('. '), dil: DIL})); store.set('cAdim_' + D.id, '{}'); imza = ''; window.scrollTo(0, 0); isYukle(D.id); }catch(er){ toast(er.message); }
  }
  else if (g === 'sil'){
    const id = D.id; try{ await api('/api/content/' + id, {method: 'DELETE'}); }catch(er){ toast(er.message); return; }
    location.hash = ''; toast('Silindi.', 'Geri al', async () => { await api(`/api/content/${id}/geri-al`, {method: 'POST'}); gecmisCiz(); });
  }
});
$('#isSayfa').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'farkliMetin') $('[data-g=farkli]').click(); });

function yonlendir(){
  clearTimeout(zaman);
  const m = location.hash.match(/^#c=([a-f0-9]{10})/);
  $('#ana').classList.toggle('hidden', !!m); $('#isSayfa').classList.toggle('hidden', !m);
  window.scrollTo(0, 0);
  if (m){ imza = ''; $('#isSayfa').innerHTML = '<a class="geri" href="#">‹ Yeni video</a>'; isYukle(m[1]); }
  else { document.title = 'Content'; gecmisCiz(); }
}
(() => { const q = new URLSearchParams(location.search);       /* başka üründen "Content'te dene": ?link=&istek= kutuları doldurur */
  if (q.get('link')){ $('#link').value = q.get('link'); $('#istek').value = q.get('istek') || ''; linkDurum(); history.replaceState(null, '', location.pathname + location.hash); } })();
addEventListener('hashchange', yonlendir);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ if (D && location.hash.startsWith('#c=')) isYukle(D.id); else if (!location.hash) gecmisCiz(); } });
yonlendir();
</script>
